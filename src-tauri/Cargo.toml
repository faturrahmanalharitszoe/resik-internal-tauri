[package]
name = "resik-desktop"
version = "0.1.0"
description = "Desktop client Resik Internal (Tauri)"
authors = ["Resik"]
edition = "2021"

[lib]
name = "resik_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
